name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y universal-ctags

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          lint-imports

      - name: Type check
        run: |
          mypy tizen-ci-shared/scripts/tizen_ci_shared
          mypy tizen-convergence-judge/scripts/tizen_convergence_judge
          mypy tizen-qb-discover/scripts/tizen_qb_discover
          mypy tizen-gerrit-fetch/scripts/tizen_gerrit_fetch
          mypy tizen-build-verify/scripts/tizen_build_verify
          mypy tizen-gerrit-submit/scripts/tizen_gerrit_submit
          mypy tizen-triage-report/scripts/tizen_triage_report
          mypy tizen-campaign-core/scripts/tizen_campaign_core
          mypy tizen-campaign-repair/scripts/tizen_campaign_repair
          mypy tizen-sandbox-submit/scripts/tizen_sandbox_submit
          mypy tizen-qb-verify/scripts/tizen_qb_verify
          mypy tizen-campaign-intake/scripts/tizen_campaign_intake
          mypy tizen-baseline-reproduce/scripts/tizen_baseline_reproduce
          mypy tizen-review-submit/scripts/tizen_review_submit
          mypy tizen-campaign-report/scripts/tizen_campaign_report
          mypy tizen-gbs-log-analysis/scripts/gbs_analyzer
          mypy tizen-gbs-build-workflow/scripts/gbs_workflow
          mypy tizen-gbs-patch-suggest/scripts/gbs_patch_suggest

      - name: Tests
        run: pytest tests/ -v --cov=gbs_analyzer --cov-report=term-missing --cov-fail-under=80
