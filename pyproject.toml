[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbs-analyzer"
version = "1.3.0"
description = "Tizen gbs build log analyzer that produces compact Evidence Packets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Jinja2>=3.1.4",
    "PyYAML>=6.0.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "import-linter==2.3",
]

[tool.setuptools.packages.find]
where = [
    "tizen-gbs-build/scripts",
    "tizen-gbs-log-analysis/scripts",
    "tizen-gbs-build-workflow/scripts",
    "tizen-gbs-patch-suggest/scripts",
    "tizen-ci-triage/scripts",
    "tizen-ci-shared/scripts",
]
include = [
    "gbs_analyzer*",
    "gbs_build_skill*",
    "gbs_workflow*",
    "gbs_patch_suggest*",
    "ci_triage*",
    "tizen_ci_shared*",
]

[tool.setuptools.package-data]
gbs_analyzer = ["patterns/*.yaml", "patterns/*.json", "patterns/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests using real git/file-system behavior",
]

[tool.coverage.run]
branch = true
source = ["gbs_analyzer"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = [
    "tizen-gbs-build/scripts",
    "tizen-gbs-log-analysis/scripts",
    "tizen-gbs-build-workflow/scripts",
    "tizen-gbs-patch-suggest/scripts",
    "tizen-ci-triage/scripts",
    "tizen-ci-shared/scripts",
]
packages = [
    "gbs_analyzer",
    "gbs_build_skill",
    "gbs_workflow",
    "gbs_patch_suggest",
    "ci_triage",
    "tizen_ci_shared",
]
